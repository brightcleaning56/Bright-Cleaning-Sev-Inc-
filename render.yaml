databases:
  - name: buildintel-db
    plan: basic-256mb          # managed Postgres with daily backups
    databaseName: buildintel
    user: buildintel

services:
  - type: web
    name: buildintel
    runtime: node
    plan: starter              # ONE instance: the app is a single writer to the database
    numInstances: 1
    buildCommand: npm ci                  # tests run in CI and before release, not on the deploy machine
    startCommand: node src/server.js
    healthCheckPath: /health
    disk:                      # encrypted app-level backups (in addition to Render's DB backups)
      name: buildintel-backups
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: buildintel-db, property: connectionString }
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: DOC_DIR
        value: /var/data/docs
      - key: EMAIL_MODE
        value: dry-run
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"   # Render sits in front of the app; client IPs come from X-Forwarded-For
      - key: BACKUP_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: SAM_API_KEY
        sync: false
