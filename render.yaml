# Render blueprint for the BUILDINTEL API. Secrets are generated by Render, or entered by the owner.
services:
  - type: web
    name: buildintel-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: buildintel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BUILDINTEL_ADMIN_KEY
        generateValue: true
      - key: BUILDINTEL_UNSUBSCRIBE_SECRET
        generateValue: true
      - key: BUILDINTEL_CORS_ORIGINS
        sync: false
      - key: BUILDINTEL_PUBLIC_URL
        sync: false
      - key: BUILDINTEL_SEND_MODE
        value: dry_run
      - key: BUILDINTEL_ALLOW_SAMPLE
        value: "0"
      - key: BUILDINTEL_AUTOPILOT
        value: off
      - key: BUILDINTEL_TRUST_PROXY
        value: "1"
      - key: BUILDINTEL_RATE_LIMIT_PER_MIN
        value: "120"
