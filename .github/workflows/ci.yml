name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bi, POSTGRES_PASSWORD: bi, POSTGRES_DB: buildintel_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bi:bi@localhost:5432/buildintel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:ci   # fails if any test is skipped or any inventoried test disappeared
      - run: npm audit --omit=dev --audit-level=high
