# BUILDINTEL owner console (static). The API runs on Render; see docs/DEPLOY_NETLIFY_RENDER.md.
[build]
  command = "node scripts/netlify-build.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.onrender.com; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
