<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUILDINTEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--panel:#fff;--panel2:#f6f8fb;--ink:#0f1f33;--muted:#5b6b7f;--line:#e1e7ef;--accent:#1f5fd1;--stake:#1f5fd1;--chip:#edf3fc;
 --pass:#16a34a;--fail:#dc2626;--owner:#b7791f;--warn:#ea580c;--side1:#0b2545;--side2:#102f57;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c141e;--panel:#132030;--panel2:#18283b;--ink:#e6edf5;--muted:#9db0c4;--line:#24384e;--accent:#4c8dff;--stake:#4c8dff;--chip:#1b2c42;
 --pass:#4ade80;--fail:#f87171;--owner:#facc15;--warn:#fb923c;--side1:#08182c;--side2:#0b2140;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Inter,"Segoe UI",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:22px}h3{font-size:16px;margin-bottom:10px}
a{color:var(--accent)}
button{font:600 13.5px Inter,system-ui,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:14px Inter,system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;width:100%}
small{color:var(--muted)}
/* app shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side1),var(--side2));color:#d6e2f2;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 30px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff}
.brand b{font:800 21px/1 Inter,sans-serif;letter-spacing:.03em}.brand small{display:block;color:#93a9c8;font-size:11px;margin-top:3px}
.side nav{display:flex;flex-direction:column;gap:1px}
.side .grp{display:flex;gap:9px;align-items:center;color:#fff;font-weight:600;font-size:14px;padding:12px 10px 4px}
.side nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:6px 10px 6px 36px;border-radius:7px;color:#bccbe0;font-size:13.5px}
.side nav button.solo{padding-left:10px;color:#fff;font-weight:600;font-size:14px}
.side nav button:hover{background:rgba(255,255,255,.07)}
.side nav button[aria-selected=true]{background:#1f5fd1;color:#fff}
svg{width:18px;height:18px;flex:none;vertical-align:-3px}
.thumb svg{width:28px;height:28px}
h3 svg{width:20px;height:20px;color:var(--accent)}
button svg{width:16px;height:16px;margin-right:4px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .links{display:flex;gap:2px;flex-wrap:wrap}
.top .links button{all:unset;cursor:pointer;padding:6px 10px;font-weight:600;font-size:14px;border-radius:6px}
.top .links button.on{color:var(--accent);background:var(--chip)}
.top .search{flex:1;max-width:440px;position:relative}.top .search input{padding-left:34px;background:var(--panel2)}
.top .search svg{position:absolute;left:10px;top:10px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.bell{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel2);cursor:pointer;border:1px solid var(--line)}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--fail);color:#fff;font:700 10px Inter,"Segoe UI",system-ui,-apple-system,sans-serif;border-radius:999px;padding:1px 5px;font-style:normal}
.who2{display:flex;gap:8px;align-items:center;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:#f59e0b;color:#fff;display:grid;place-items:center;font:700 12px Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
.content{padding:18px 22px 40px}
/* building blocks */
.card,.empty,.gate,.sign{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card{padding:14px 16px}
.empty{padding:22px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--ink)}
.pill.green{background:#dcfce7;color:#166534}.pill.amber{background:#fef3c7;color:#92400e}.pill.red{background:#fee2e2;color:#991b1b}
.gate{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 14px;margin-bottom:8px}
.gate small{display:block;word-break:break-word}
.tag{font:700 11px Inter,"Segoe UI",system-ui,-apple-system,sans-serif;padding:3px 6px;border-radius:5px;text-align:center;align-self:start}
.tag.pass{background:var(--pass);color:#fff}.tag.fail{background:var(--fail);color:#fff}.tag.owner_action{border:1.5px solid var(--owner);color:var(--owner)}
.sign{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:16px 20px;margin-bottom:16px;border-left:6px solid var(--accent)}
.sign .verdict{font:800 46px/1 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--fail)}.sign .verdict.go{color:var(--pass)}
.sign p{margin:4px 0 0;color:var(--muted)}
.login{max-width:400px;margin:10vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;border-top:6px solid var(--accent)}
.login label{display:block;margin:14px 0 4px;font-weight:600}
.err{color:var(--fail);min-height:1.2em;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi{min-width:0}.kpi>div{min-width:0}.kpi b{display:block;overflow-wrap:anywhere;font:800 23px/1.15 Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.kpi span{font-size:12.5px;color:var(--muted)}
#map,.mapbox{height:240px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
/* command center workspace */
.ws{display:grid;grid-template-columns:250px minmax(0,1fr) 262px;gap:12px;align-items:start}
.ws>*{min-width:0}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px;margin:8px 0}
.seg button{all:unset;flex:1;text-align:center;padding:6px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.flt{display:grid;gap:8px;margin:8px 0}.flt label{font-size:12px;font-weight:600;color:var(--muted)}
.res{display:flex;gap:10px;padding:9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-bottom:8px;background:var(--panel)}
.res:hover{border-color:var(--accent)}.res.on{border-color:#f59e0b;background:#fff8eb}
@media (prefers-color-scheme:dark){.res.on{background:#2a2414}}
.thumb{width:66px;height:54px;border-radius:7px;background:linear-gradient(135deg,#dbe7f7,#a9c2e6);display:grid;place-items:center;color:#1f5fd1;flex:none}
.thumb.big{width:210px;height:118px;border-radius:9px}.thumb.big svg{width:46px;height:46px}
.res b{display:block;font-size:13.5px}.res small{display:block;font-size:12px}
.hdr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.stat b{white-space:nowrap;display:block;font:800 20px/1.2 Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 12px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:13.5px}.kv span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px 6px 24px;position:relative;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:6px;top:12px;width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);background:var(--panel)}
.tl li.done:before{border-color:var(--pass);background:var(--pass)}.tl li.now{background:var(--chip);border-radius:6px}
.checks{list-style:none;margin:0;padding:0}.checks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13.5px}
.dot{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 11px Inter,"Segoe UI",system-ui,-apple-system,sans-serif;margin-top:1px}
.dot.ok{background:var(--pass)}.dot.no{background:#cbd5e1;color:#475569}
.contact{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ini{width:34px;height:34px;border-radius:50%;background:#fde68a;color:#7c4a03;display:grid;place-items:center;font:700 12px Inter,"Segoe UI",system-ui,-apple-system,sans-serif;flex:none}
.btnfull{display:block;width:100%;text-align:center;margin-top:8px}
.green{color:var(--pass)}.due{color:var(--fail);font-weight:600}
@media (max-width:1300px){.ws{grid-template-columns:260px minmax(0,1fr)}.ws>.rightcol{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}}
@media (max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:8px}.brand{padding-bottom:8px}
 .side nav{flex-direction:row;overflow-x:auto}.side .grp{display:none}.side nav button{padding:6px 10px;white-space:nowrap}
 .top .links{display:none}.ws{grid-template-columns:1fr}.hdr{grid-template-columns:1fr}.thumb.big{display:none}
 .top{flex-wrap:wrap;padding:10px 12px}.top .search{order:3;flex-basis:100%;max-width:none}.who2>span:last-child{display:none}
 .content{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}.kpi .ic{width:34px;height:34px}.kpi b{font-size:19px}}
/* legacy screens inside the new shell */
.shell nav{display:none}

/* density + mockup details */
body{font-size:13px}h2{font-size:20px}h3{font-size:14.5px;margin-bottom:8px}
.card{padding:12px 14px}.kpi{padding:12px}.kpi b{font-size:21px}
.side{width:auto}.side .grp{cursor:pointer;justify-content:space-between;padding:10px 10px 4px}.side .grp>span{display:flex;gap:9px;align-items:center}
.side .grp .chev{transition:transform .15s;width:14px;height:14px;opacity:.7}.side .grp.closed .chev{transform:rotate(-90deg)}
.side .grp.closed+.sub{display:none}.side .sub{display:flex;flex-direction:column}
.top .links button+button:before{content:"•";color:var(--muted);margin-right:10px;font-weight:400}
.top .links button{padding:6px 4px;margin-right:6px}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--panel2)}
.pop{position:absolute;right:22px;top:56px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,31,51,.15);padding:12px 14px;z-index:40;max-width:360px}
.delta{display:inline-block;font:700 11.5px Inter,"Segoe UI",system-ui,sans-serif;margin-left:6px}.delta.up{color:var(--pass)}.delta.down{color:var(--fail)}
.flt .fi{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.flt .fi svg{color:var(--muted)}.flt .fi label{display:block;font-size:11.5px;font-weight:600;color:var(--ink)}
.flt .fi input,.flt .fi select{border:none;padding:2px 0;background:transparent;font-size:12.5px}
.flt .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res .thumb{width:72px;height:56px;overflow:hidden;padding:0}.res .thumb svg{width:100%;height:100%}
.thumb.big{padding:0;overflow:hidden}.thumb.big svg{width:100%;height:100%}
.res .due{font-size:12px}
.hdr{grid-template-columns:200px minmax(0,1fr) auto;grid-template-areas:"img title btn" "img stats stats";align-items:start;gap:10px 16px}
.hdr>.thumb{grid-area:img}.hdr>.ttl{grid-area:title}.hdr>.stats{grid-area:stats}.hdr>.btns{grid-area:btn}
.thumb.big{width:200px;height:126px}.side{font-size:13px}
.tabs button{display:flex;gap:6px;align-items:center}.tabs svg{width:15px;height:15px}
.ov{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.35fr);gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel)}
.panel h3{display:flex;gap:8px;align-items:center;font-size:14px}
.viewer{display:grid;grid-template-columns:78px minmax(0,1fr) 110px;gap:8px;min-height:250px}
.viewer .sheets{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:280px}
.viewer .sheet{border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center;font-size:11px;cursor:pointer;background:var(--panel2)}
.viewer .sheet.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--chip)}
.viewer .canvas{border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;overflow:auto;max-height:300px}
.viewer .tools{display:flex;flex-direction:column;gap:4px}.viewer .tools button{text-align:left;font-size:12px;padding:5px 8px}
.vbar{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}
.link{color:var(--accent);font-weight:600;text-decoration:none;display:inline-block;margin-top:8px;cursor:pointer}
.donut{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;align-items:center;justify-items:center}.donut svg{width:112px;height:112px}.donut .legend{justify-self:stretch}.legend div{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:2px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.btn-green{background:#16a34a;border-color:#16a34a;color:#fff}
.bars div{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.bars span.b{height:12px;border-radius:6px;background:var(--accent);display:block}
.ctc a{color:var(--accent);margin-left:6px}
@media (max-width:1300px){.ov,.row3{grid-template-columns:1fr}}

/* takeoff viewer */
.tk{position:fixed;inset:0;z-index:60;background:rgba(10,20,35,.55);display:grid;place-items:stretch;padding:16px}
.tk>div{background:var(--panel);border-radius:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;min-height:0}
.tkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tkbar select,.tkbar input{width:auto}.tkbar .on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tkmain{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:0}
.tkpage{overflow:auto;background:#d9dee5;padding:14px;min-height:0}
.tkwrap{position:relative;display:inline-block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.tkwrap svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.tklist{border-left:1px solid var(--line);overflow:auto;padding:10px 12px;min-height:0}
.tklist .it{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tkfoot{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
@media (max-width:900px){.tkmain{grid-template-columns:1fr}.tklist{max-height:30vh;border-left:0;border-top:1px solid var(--line)}}

.ws2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}.ws2>*{min-width:0}
@media (max-width:1100px){.ws2{grid-template-columns:1fr}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.ph h1{font-size:22px;margin:0;display:flex;gap:10px;align-items:center}.ph h1 svg{width:24px;height:24px;color:var(--accent)}
.ph p{margin:4px 0 0;color:var(--muted);max-width:820px}
#pbody>form,#pbody>.scroll,#pbody>table{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
#pbody>.gate{border-radius:10px}#pbody h2{font-size:18px}
#pbody .scroll:not(.card .scroll):not(.panel .scroll):not(form .scroll){background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.top .search{min-width:210px}
@media (max-width:1650px){.who2 small{display:none}.top .links button{font-size:13px}}
.top .links{flex-wrap:nowrap}
@media (max-width:1650px){.top .links button[data-tl="estimates:estimating"]{display:none}}  /* same page as Takeoff */
</style>
</head>
<body>
<div id="app"></div>
<footer id="attrib" style="max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px"></footer>
<script src="/main.js"></script>
</body>
</html>
