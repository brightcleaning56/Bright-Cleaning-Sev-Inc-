<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>My jobs · Bright Clean</title>
<style>
  :root { --navy:#0f2741; --blue:#1f6fd1; --line:#dfe6ee; --muted:#5d728a; --green:#17904c; --red:#d1382f; }
  * { box-sizing: border-box; } body { margin: 0; font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f2f5f9; color: #10263e; }
  header { background: var(--navy); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; position: sticky; top: 0; z-index: 5; }
  header b { font-size: 18px; } header small { display: block; color: #c6d6e6; }
  main { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .job h2 { margin: 0 0 4px; font-size: 18px; } .muted { color: var(--muted); font-size: 14px; } .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#e6f0fd; color:var(--blue); }
  .pill.done { background:#e3f6ea; color:var(--green); } .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button, .btn { flex:1 1 140px; min-height:48px; border:0; border-radius:12px; font:inherit; font-weight:700; padding:10px 14px; cursor:pointer; text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
  .primary { background: var(--blue); color:#fff; } .ghost { background:#eef3f9; color:#10263e; } .danger { background:#fde8e8; color:var(--red); } .ok { background: var(--green); color:#fff; }
  ul.check { list-style:none; padding:0; margin:8px 0 0; } ul.check li { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); } ul.check input { width:24px; height:24px; }
  .sec { font-weight:700; margin-top:10px; } .msg { padding:10px 12px; border-radius:10px; margin-bottom:10px; } .msg.err { background:#fde8e8; color:#a52a22; } .msg.good { background:#e3f6ea; color:#0f6b38; }
  textarea, input[type=text] { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; }
</style></head>
<body><header><b id="who">My jobs</b><small id="sub">Loading…</small></header>
<main><div id="msg"></div><div id="jobs"></div></main>
<script src="/assets/crew-page.js"></script></body></html>
