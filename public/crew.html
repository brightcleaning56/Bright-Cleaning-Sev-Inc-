<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f2741"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bright Clean Crew"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Crew Portal · Bright Clean</title>
<style>
  :root { --navy:#0f2741; --blue:#1f6fd1; --line:#dfe6ee; --muted:#5d728a; --green:#17904c; --red:#d1382f; --amber:#b7791f; }
  * { box-sizing: border-box; } body { margin: 0; font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f2f5f9; color: #10263e; overflow-x: hidden; }
  header { background: var(--navy); color: #fff; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand small { display: block; color: #c6d6e6; letter-spacing: .04em; font-size: 11px; text-transform: uppercase; }
  .brand b { font-size: 17px; }
  #who { font-size: 15px; } #sub { display: block; color: #c6d6e6; font-size: 13px; }
  header .who { margin-left: auto; text-align: right; }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-left)) 8px max(12px, env(safe-area-inset-left)); position: sticky; top: 0; z-index: 4; }
  nav.tabs button { flex: 0 0 auto; min-height: 44px; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
  nav.tabs button.on { background: var(--blue); color: #fff; }
  main { padding: 14px max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); max-width: 1120px; margin: 0 auto; }
  .hero { background: linear-gradient(90deg, #eaf2fd, #f7fbff); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .hero h1 { margin: 2px 0 0; font-size: 24px; } .hero p { margin: 2px 0 0; color: var(--muted); }
  .datechip { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
  .grid { display: grid; gap: 12px; } @media (min-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; } @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; } .stat small { color: var(--muted); font-weight: 700; } .stat b { display: block; font-size: 26px; }
  .subtabs { display: flex; gap: 6px; margin-bottom: 10px; } .subtab { flex: 1 1 0; min-height: 44px; border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; }
  .subtab.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .job { border-left: 5px solid #c9d6e5; } .job.live { border-left-color: var(--blue); } .job.done { border-left-color: var(--green); opacity: .92; }
  .jtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .job h2 { margin: 0 0 6px; font-size: 18px; } .meta { color: var(--muted); font-size: 14px; } .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .muted { color: var(--muted); font-size: 14px; } .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#e6f0fd; color:var(--blue); }
  .pill.done { background:#e3f6ea; color:var(--green); }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .photos, .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; } .photos b { width: 100%; font-size: 14px; }
  button.big, .btn.big { min-height: 64px; flex-direction: column; font-size: 17px; } button.big small { font-weight: 500; font-size: 12px; opacity: .85; }
  button, .btn { flex: 1 1 120px; min-height: 48px; border:0; border-radius:12px; font:inherit; font-weight:700; padding:10px 14px; cursor:pointer; text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
  .primary { background: var(--blue); color:#fff; } .ghost { background:#eef3f9; color:#10263e; } .danger { background:#fde8e8; color:var(--red); } .ok { background: var(--green); color:#fff; }
  .ring { display: flex; align-items: center; gap: 14px; position: relative; } .ring svg { flex: none; } .ring .pct { position: absolute; left: 14px; top: 14px; width: 84px; text-align: center; font-size: 20px; font-weight: 800; line-height: 84px; }
  .qa { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .qa button { min-height: 72px; flex-direction: column; font-size: 14px; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; } summary { cursor: pointer; font-weight: 700; color: var(--blue); min-height: 40px; display: flex; align-items: center; }
  ul.check { list-style:none; padding:0; margin:8px 0 0; } ul.check li { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); } ul.check input { width:24px; height:24px; }
  .sec { font-weight:700; margin-top:10px; } .msg { padding:10px 12px; border-radius:10px; margin-bottom:10px; } .msg.err { background:#fde8e8; color:#a52a22; } .msg.good { background:#e3f6ea; color:#0f6b38; }
  h3.day { margin: 14px 0 6px; font-size: 15px; color: var(--muted); } .row-job b { font-size: 15px; }
  .ph-up:focus-within { outline: 3px solid #1f6fb2; outline-offset: 2px; }
  [hidden] { display: none !important; }
  textarea, select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; margin: 6px 0; } .bubble.me { background: #e6f0fd; margin-left: auto; } .bubble.office { background: #f1f5f9; }
  .bubble small { color: var(--muted); display: block; }
</style></head>
<body>
<header>
  <div class="brand"><small>Bright Clean Operations</small><b>Crew Portal</b></div>
  <div class="who"><b id="who">Loading…</b><small id="sub"></small></div>
</header>
<nav class="tabs" aria-label="Crew portal">
  <button type="button" data-view="jobs" class="on">My jobs</button>
  <button type="button" data-view="schedule">Schedule</button>
  <button type="button" data-view="photos">Photos</button>
  <button type="button" data-view="incidents">Incidents</button>
  <button type="button" data-view="messages">Messages</button>
  <button type="button" data-view="profile">Profile</button>
</nav>
<main>
  <div id="net" class="msg" style="background:#fff7e0;color:#7a5200" hidden></div>
  <div id="msg"></div>
  <div id="v-jobs"></div>
  <div id="v-schedule" hidden></div>
  <div id="v-photos" hidden></div>
  <div id="v-incidents" hidden></div>
  <div id="v-messages" hidden></div>
  <div id="v-profile" hidden></div>
</main>
<script src="/assets/crew-page.js"></script></body></html>
