<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>System status · Bright Clean</title>
<style>
  :root { --navy:#0f2741; --line:#dfe6ee; --muted:#5d728a; --green:#17904c; --red:#d1382f; --amber:#b7791f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --navy:#0b1b2e; --line:#2a3a4f; --muted:#9fb3c8; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f2f5f9; color: #10263e; }
  header { background: var(--navy); color: #fff; padding: 18px 16px; }
  header b { font-size: 18px; } main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .state { font-size: 20px; font-weight: 700; } .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
  .muted { color: var(--muted); font-size: 14px; } dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0 0; } dt { color: var(--muted); } dd { margin: 0; }
  a { color: #1f6fd1; }
</style></head>
<body>
<header><b>Bright Clean · System status</b></header>
<main>
  <div class="card" id="box">
    <div class="state"><span class="dot" id="dot" style="background:var(--amber)"></span><span id="state">Checking…</span></div>
    <dl>
      <dt>Database</dt><dd id="db">—</dd>
      <dt>Running for</dt><dd id="up">—</dd>
      <dt>Version</dt><dd id="ver">—</dd>
      <dt>Errors in the last hour</dt><dd id="err">—</dd>
      <dt>Last checked</dt><dd id="checked">—</dd>
    </dl>
  </div>
  <p class="muted">This page checks the live system every minute. If it shows a problem, the message above is the first thing to read. Support: info@brightclean.net.</p>
</main>
<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  function fmtUp(s) { if (s == null) return '—'; var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + 'd ' : '') + h + 'h ' + m + 'm'; }
  function show(ok, label, color) { el('state').textContent = label; el('dot').style.background = color; }
  function check() {
    fetch('/api/health', { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (x) {
        var j = x.j || {};
        if (x.status === 200 && j.ok && j.db === 'ok') show(true, 'All systems running', 'var(--green)');
        else show(false, 'Some parts are not running', 'var(--red)');
        el('db').textContent = j.db === 'ok' ? 'OK' : (j.db || 'Not responding');
        el('up').textContent = fmtUp(j.uptime_s);
        el('ver').textContent = j.version ? j.version + ' (build ' + j.build + ')' : '—';
        el('err').textContent = j.errors_1h == null ? '—' : String(j.errors_1h);
        el('checked').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      })
      .catch(function () { show(false, 'Cannot reach the system right now', 'var(--red)'); el('checked').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); });
  }
  check(); setInterval(check, 60000);
})();
</script>
</body></html>
