<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f2741">
<title>Job progress · Bright Cleaning Sev Inc.</title>
<style>
  :root { --navy:#0f2741; --blue:#1f6fd1; --line:#dfe6ee; --muted:#5d728a; --green:#17904c; --red:#d1382f; --amber:#b7791f; }
  * { box-sizing: border-box; } body { margin: 0; font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f2f5f9; color: #10263e; overflow-x: hidden; }
  header { background: var(--navy); color: #fff; padding: calc(14px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
  header small { display: block; color: #c6d6e6; letter-spacing: .04em; font-size: 11px; text-transform: uppercase; } header b { font-size: 17px; }
  main { padding: 14px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; } .muted { color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #e6f0fd; color: var(--blue); margin: 6px 0 2px; }
  .pill.done { background: #e3f6ea; color: var(--green); } .pill.live { background: #fff1d6; color: var(--amber); } .pill.cancel { background: #fde8e8; color: var(--red); }
  ol.steps { list-style: none; margin: 8px 0 0; padding: 0; } ol.steps li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  ol.steps li:first-child { border-top: 0; } .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 5px; flex: none; background: #c9d6e5; }
  li.on .dot { background: var(--green); } li.on b { color: #0f6b38; } li b { display: block; } li small { color: var(--muted); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #eef3f9; }
  .msg { padding: 12px; border-radius: 10px; background: #fde8e8; color: #a52a22; }
</style></head>
<body>
<header><small>Bright Cleaning Sev Inc. Operations</small><b>Job progress</b></header>
<main>
  <div id="out"><p class="muted">Loading the job…</p></div>
</main>
<script src="/assets/track-page.js"></script></body></html>
