<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Clean Proposal</title><link rel="stylesheet" href="/assets/site.css"><style>body{background:#f3f5f8}.proposal{max-width:900px;margin:38px auto;background:white;padding:clamp(22px,5vw,56px);border-radius:14px;box-shadow:0 12px 40px #12243a12}.proposal-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #e8edf2;padding-bottom:22px}.proposal h1,.proposal h2{color:#102b49}.proposal .total{font-size:34px;font-weight:800;color:#102b49}.scope{white-space:pre-wrap;line-height:1.7}.terms{white-space:pre-wrap;background:#f5f7f9;padding:18px;border-radius:8px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.error{padding:18px;background:#fff0ed;color:#9c2e20}@media(max-width:600px){.proposal-head{display:block}}</style></head><body><main class="proposal"><div id="content">Loading proposal…</div></main><script>
const token=location.pathname.split('/').filter(Boolean).pop(),root=document.querySelector('#content');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));
(async()=>{try{const r=await fetch('/api/proposal/'+encodeURIComponent(token));const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load proposal');const p=j.proposal,items=p.line_items||[];root.innerHTML=`<div class="proposal-head"><div><div class="logo"><span class="logo-mark">B</span><span>BRIGHT CLEANING SEV INC<small>COMMERCIAL CLEANING & CONSTRUCTION SERVICES</small></span></div><h1>Commercial Services Proposal</h1><p>${esc(p.project_name||'Project proposal')}<br>${esc(p.site_address||'')}</p></div><div><b>Prepared for</b><p>${esc(p.customer_name)}<br>${esc(p.company)}</p><small>Proposal #${p.id}<br>Valid through: ${esc(p.expires_on||'As stated in terms')}</small></div></div><section><h2>Scope of work</h2><div class="scope">${esc(p.scope)}</div></section>${items.length?`<section><h2>Proposed line items</h2><table class="admin-table"><tbody>${items.map(i=>`<tr><td>${esc(i.description)}</td><td style="text-align:right">${money(i.amount)}</td></tr>`).join('')}</tbody></table></section>`:''}<section><h2>Proposal investment</h2><div class="total">${money(p.proposal_total)}</div><p class="muted">Final pricing is subject to the scope, assumptions, exclusions and terms below.</p></section><section><h2>Terms, assumptions & exclusions</h2><div class="terms">${esc(p.terms||'Please contact Bright Clean to confirm final commercial terms and project schedule.')}</div></section><p class="notice">Approval records your acceptance of this proposal for follow-up. A separate executed service agreement, purchase order and site mobilization confirmation may still be required before work begins. This page is not an electronic-signature service.</p><div class="actions"><button class="btn dark" id="print">Print / save PDF</button><button class="btn" id="approve">Approve proposal</button><button class="btn dark" id="decline">Decline</button><span id="response"></span></div><p class="mini muted">Bright Cleaning Sev Inc. · Commercial cleaning and construction services</p>`;async function respond(decision){if(!confirm(decision==='approve'?'Approve this proposal?':'Decline this proposal?'))return;const rr=await fetch('/api/proposal/'+encodeURIComponent(token)+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})}),jj=await rr.json();if(!rr.ok)throw Error(jj.error||'Unable to submit response');document.querySelector('#response').textContent=jj.message;document.querySelector('#approve').disabled=true;document.querySelector('#decline').disabled=true}document.querySelector('#print').onclick=()=>window.print();document.querySelector('#approve').onclick=()=>respond('approve').catch(e=>alert(e.message));document.querySelector('#decline').onclick=()=>respond('decline').catch(e=>alert(e.message));}catch(e){root.innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script></body></html>
